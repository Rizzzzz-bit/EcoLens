services:
  - type: web
    name: ecolens-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m scripts.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecolens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: UPLOAD_DIR
        value: uploads
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel URL after deploying frontend

databases:
  - name: ecolens-db
    databaseName: ecolens
    user: ecolens
